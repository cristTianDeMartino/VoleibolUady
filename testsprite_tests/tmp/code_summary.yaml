version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 16 (App Router, Server Components, Server Actions)
  - React 19
  - Prisma 7 (better-sqlite3 adapter)
  - Tailwind CSS
  - bcryptjs (access-code hashing)
routes:
  - path: /login
    file: app/login/page.tsx
    auth_required: false
    description: "Single-field login: input name=codigoAcceso. ADMIN code is ADMIN001 (dev seed button 'Crear Admin Maestro' creates it if missing). JUGADOR codes are seeded in prisma/seed.ts, e.g. ANA001, LAURA002."
  - path: /perfil
    file: app/perfil/page.tsx
    auth_required: true
    description: "Own-profile page for the logged-in athlete/admin (PerfilClient.tsx). Redirects to /login if no session."
  - path: /atletas
    file: app/atletas/page.tsx
    auth_required: true
    description: "Roster list, links to /atletas/[id] for each athlete."
  - path: /atletas/[id]
    file: app/atletas/[id]/page.tsx
    auth_required: true
    description: "Athlete detail/profile page viewed by another user (admin or teammate). Card visibility depends on session.rol and whether session.id === id."
known_limitations: []
features:
  - name: "Visibilidad de cards en perfil ajeno segun rol (privacidad)"
    description: >
      In app/atletas/[id]/page.tsx, canViewPrivate = session.rol === 'ADMIN' || session.id === id.
      Always rendered: 'Informacion Academica' (inline dl) and CardDeportiva ('Informacion Deportiva').
      CardContacto is ALWAYS rendered but with two distinct variants: variant='completo' (correo,
      telefonoPersonal, telefonoTutor + '🔒 Privado' badge) when canViewPrivate is true, vs
      variant='reducido' (ONLY correo and telefonoPersonal, no badge, no edit button) when false.
      CardMedica ('Datos Medicos', with '🔒 Privado' badge, shows NSS and 'Seguro Medico Privado')
      and the 'Historial Medico de Lesiones' table are conditionally rendered with
      `{canViewPrivate && (...)}` in JSX — when false, these are completely absent from the DOM
      (not just CSS-hidden), and the server query does not even include the relational `privado`
      field in that case (`privado: canViewPrivate` in the prisma select).
    files:
      - app/atletas/[id]/page.tsx
      - components/AtletaPublicCards.tsx
      - lib/auth.ts
    entry_route: /atletas/[id]
    user_interactions:
      - "Log in as ADMIN (codigoAcceso=ADMIN001) and open /atletas/[id] for any JUGADOR athlete (e.g. ANA001's id) — exactly 4 cards must be present: 'Informacion Academica', 'Informacion Deportiva', 'Informacion de Contacto' (with text '🔒 Privado' badge, showing Correo, Telefono Personal, AND Telefono Tutor / Familiar), and 'Datos Medicos' (with '🔒 Privado' badge, showing an NSS value and a 'Seguro Medico Privado' value built from aseguradora/poliza/titular)."
      - "Log in as an athlete (codigoAcceso=ANA001) and open /perfil (own profile) — verify the same 4 sections of data are present (academic, sportive, contact with telefonoTutor, medical with NSS/seguro), and verify the page nowhere displays the athlete's own access code/clave (search rendered text for any 6-character alphanumeric code or a label like 'Clave' / 'Codigo de Acceso' — none should appear in /perfil)."
      - "Log in as an athlete (codigoAcceso=ANA001) and navigate to a teammate's profile at /atletas/[id] using a DIFFERENT athlete's id (e.g. LAURA002's id) — verify exactly 3 cards are visible: 'Informacion Academica', 'Informacion Deportiva', and 'Informacion de Contacto' WITHOUT any '🔒 Privado' badge text and showing ONLY Correo and Telefono Personal (the label 'Telefono Tutor / Familiar' must not appear anywhere on the page)."
      - "On that same teammate page, assert that the heading text 'Datos Medicos' is absent from the entire DOM (not present even in a collapsed/hidden state), and that no NSS-like value, insurance value, or access code appears anywhere on the page."
    api_calls:
      - method: SERVER_COMPONENT_QUERY
        endpoint: "prisma.atleta.findUnique in app/atletas/[id]/page.tsx — select.privado is conditionally set to canViewPrivate (boolean), so the related AtletaPrivado row is never fetched/serialized for unauthorized viewers"
    auth_required: true

  - name: "Botones de accion administrativa visibles solo para ADMIN"
    description: >
      In app/atletas/[id]/page.tsx, the entire admin-actions block (BotonEgresarAtleta /
      BotonReactivarAtleta + BotonEliminarAtleta) is wrapped in `{session?.rol === 'ADMIN' && (...)}`.
      Within that block, BotonEgresarAtleta ('Asignar como Egresado') shows when atleta.estado is
      'ACTIVO', and BotonReactivarAtleta ('Reactivar atleta') shows when atleta.estado is 'EGRESADO'.
      BotonEliminarAtleta ('Eliminar atleta por completo') always shows alongside whichever of the two.
    files:
      - app/atletas/[id]/page.tsx
      - components/BotonEstadoAtleta.tsx
      - components/BotonEliminarAtleta.tsx
    entry_route: /atletas/[id]
    user_interactions:
      - "Log in as an athlete (codigoAcceso=ANA001), open a teammate's profile (a different athlete id) — verify none of the buttons 'Asignar como Egresado', 'Reactivar atleta', or 'Eliminar atleta por completo' are present anywhere on the page."
      - "Log in as ADMIN (codigoAcceso=ADMIN001), open the profile of an athlete currently in estado ACTIVO — verify both 'Asignar como Egresado' and 'Eliminar atleta por completo' buttons are visible, and 'Reactivar atleta' is NOT present."
      - "As ADMIN, open the profile of an athlete currently in estado EGRESADO (or one egresado via the flow below) — verify 'Reactivar atleta' and 'Eliminar atleta por completo' are visible, and 'Asignar como Egresado' is NOT present."
    api_calls: []
    auth_required: true

  - name: "Flujo Egresar / Reactivar atleta (modal de confirmacion + toast)"
    description: >
      BotonEgresarAtleta opens a confirmation modal (heading '¿Marcar a {nombre} como egresado?')
      with Cancelar/'Si, egresar' buttons. Confirming calls server action egresarAtleta(atletaId)
      (app/actions/atleta.actions.ts), closes the modal, and shows a green-bordered toast
      '{nombre} ha sido registrado como egresado correctamente' that auto-hides after ~4s.
      The page then re-renders with estado=EGRESADO, so BotonReactivarAtleta ('Reactivar atleta')
      replaces the egresar button. Confirming that modal calls reactivarAtleta(atletaId), shows
      toast '{nombre} ha sido reactivado correctamente', and the athlete returns to estado ACTIVO.
    files:
      - components/BotonEstadoAtleta.tsx
      - app/actions/atleta.actions.ts
      - app/atletas/[id]/page.tsx
    entry_route: /atletas/[id]
    user_interactions:
      - "As ADMIN, on an ACTIVO athlete's profile (use a teammate other than ANA001/LAURA002 if available, e.g. the athlete with codigoAcceso SOFIA003, to avoid disturbing the other test fixtures), click 'Asignar como Egresado' — a modal appears containing the athlete's full name in the heading text."
      - "Click 'Si, egresar' in the modal — the modal closes, a success toast with the athlete's name appears, and the page now shows the 'Reactivar atleta' button instead of 'Asignar como Egresado'."
      - "Click 'Reactivar atleta' — a confirmation modal appears containing the athlete's name; click 'Si, reactivar' — verify a success toast appears and the page reverts to showing 'Asignar como Egresado' (estado is ACTIVO again)."
    api_calls:
      - method: SERVER_ACTION
        endpoint: "egresarAtleta(atletaId) in app/actions/atleta.actions.ts"
      - method: SERVER_ACTION
        endpoint: "reactivarAtleta(atletaId) in app/actions/atleta.actions.ts"
    auth_required: true

  - name: "Modal de eliminacion de atleta (sin eliminar al cancelar)"
    description: >
      BotonEliminarAtleta renders a button 'Eliminar atleta por completo' that opens a modal
      dialog (not inline red text) titled '¿Eliminar permanentemente a {nombre}?' with
      Cancelar / 'Si, eliminar definitivamente' buttons. Clicking Cancelar (or clicking the
      dark overlay) closes the modal via local state with no server action invoked — the
      athlete is not deleted. Only confirming calls eliminarAtletaPorCompleto(atletaId).
    files:
      - components/BotonEliminarAtleta.tsx
      - app/actions/atleta.actions.ts
    entry_route: /atletas/[id]
    user_interactions:
      - "As ADMIN, on any athlete's profile, click 'Eliminar atleta por completo' — verify a modal dialog (overlay + centered white card, not an inline red paragraph) appears containing the athlete's full name in the heading '¿Eliminar permanentemente a {nombre}?'."
      - "Click 'Cancelar' in that modal — verify the modal closes immediately, no toast/error appears, and reloading or revisiting the athlete's profile shows the athlete still exists with all of their data intact (must NOT actually delete; do not click 'Si, eliminar definitivamente')."
    api_calls:
      - method: SERVER_ACTION
        endpoint: "eliminarAtletaPorCompleto(atletaId) in app/actions/atleta.actions.ts — ONLY exercise the Cancelar path in this test, never confirm the delete"
    auth_required: true
